        bigPrompt: `你是良興的 Google Workspace 使用顧問,協助同仁解決 Workspace 各項功能的使用問題。

【受眾】
良興的一般同仁,不是 IT 人員,多數沒有 Workspace 使用經驗。有些人在門市第一線,
可能正在忙、旁邊有客人。不要用專有名詞(OU、網域、權限繼承),需要時用白話解釋,

【紅線 — 優先於其他所有規則】
你會直接讀取當前網頁,使用者無法選擇不讓你讀,所以不要要求他「改成代號後

- 回覆裡不要複述頁面上的個資(姓名、員工編號、電話、薪資、客戶資料)。

方案為 Google Workspace Business Starter。

日曆移轉原則:不要教使用者用「匯入/匯出」(.ics 檔)把舊日曆搬過來。

- 公司或門市的行事曆 → 由原本擁有部門行事曆的人共用給需要的人,

若使用者問「怎麼把原本的日曆搬過來」,直接教共用的做法。

【權限與共用類問題】
問題出現「共用、分享、權限、存取、對外」這類字眼時,照一般做法回答,

【回答規則】

const STORAGE_KEY = "lx-workspace-map-progress";
function loadDone() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveDone(done) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(done));
}
let done = loadDone();

function totalWaypoints() {
  return DATA.reduce((sum, r) => sum + r.waypoints.length, 0);
}
function doneCount(regionId) {
  const region = DATA.find(r => r.id === regionId);
  return region.waypoints.filter((w, i) => done[regionId + ":" + i]).length;
}
function totalDoneCount() {
  return DATA.reduce((sum, r) => sum + doneCount(r.id), 0);
}
function updateProgress() {
  const total = totalWaypoints();
  const d = totalDoneCount();
  document.getElementById("progress-fill").style.width = (total ? (d / total * 100) : 0) + "%";
  document.getElementById("progress-label").textContent = d + " / " + total + " 完成";
}

function renderGrid() {
  const grid = document.getElementById("region-grid");
  grid.innerHTML = DATA.map(r => {
    const d = doneCount(r.id);
    return `
      <button class="region-card" style="--rc: var(--${r.color}); --rc-soft: var(--${r.color}-soft);" data-region="${r.id}">
        <div class="region-top">
          <div class="region-icon">${ICONS[r.id]}</div>
          <div>
            <div class="region-num">STOP ${r.num}</div>
            <p class="region-title">${r.title}</p>
          </div>
        </div>
        <p class="region-desc">${r.desc}</p>
        <div class="region-meta"><span>${r.waypoints.length} 個路標</span><strong>${d}/${r.waypoints.length}</strong></div>
      </button>
    `;
  }).join("");
  grid.querySelectorAll(".region-card").forEach(btn => {
    btn.addEventListener("click", () => openRegion(btn.dataset.region));
  });
}

function waypointDetail(w, regionId, idx) {
  let blocks = "";
  if (w.one) {
    blocks += `<div class="detail-block"><span class="detail-label">說明</span><p style="margin:0;font-size:14px;">${w.one}</p></div>`;
  }
  if (w.prompt) {
    blocks += `
      <div class="detail-block">
        <span class="detail-label">問 Gemini</span>
        <div class="prompt-box">
          <span class="prompt-text">${w.prompt}</span>
          <button class="copy-btn" data-copy="${w.prompt.replace(/"/g, '&quot;')}">複製</button>
        </div>
      </div>`;
  }
  if (w.steps) {
    blocks += `
      <div class="detail-block">
        <span class="detail-label">${w.stepsLabel || "安裝步驟"}</span>
        <div class="steps-box"><ol>${w.steps.map(s => `<li>${s}</li>`).join("")}</ol></div>
      </div>`;
  }
  if (w.bigPrompt) {
    blocks += `
      <div class="detail-block">
        <span class="detail-label">${w.bigPromptLabel || "完整指令(整段複製)"}</span>
        <div class="big-prompt-box">
          <pre class="big-prompt-text">${w.bigPrompt.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</pre>
          <button class="copy-btn" data-copy="${w.bigPrompt.replace(/"/g, '&quot;')}">複製全部</button>
        </div>
      </div>`;
  }
  if (w.groups) {
    blocks += w.groups.map(g => `
      <div class="detail-block">
        <span class="detail-label">${g.title}</span>
        <div class="steps-box"><ol>${g.items.map(i => `<li>${i}</li>`).join("")}</ol></div>
      </div>`).join("");
  }
  if (w.note) {
    blocks += `<div class="detail-block"><div class="note-box">${w.note}</div></div>`;
  }
  if (w.link) {
    blocks += `
      <div class="detail-block">
        <span class="detail-label">${w.linkLabel ? "連結" : "官方說明"}</span>
        <div class="link-row">
          <a class="link-btn" href="${w.link}" target="_blank" rel="noopener">${w.linkLabel || "前往官方說明中心"} ↗</a>
          ${w.search ? `<span class="search-hint">到說明中心後搜尋：<b>${w.search}</b></span>` : ""}
        </div>
      </div>`;
  }
  if (w.tip) {
    blocks += `<div class="detail-block"><div class="note-box" style="border:1px solid var(--rc);"><b style="color:var(--rc);">小技巧：</b>${w.tip}</div></div>`;
  }
  if (w.assets) {
    blocks += `
      <div class="detail-block">
        <span class="detail-label">設計部提供圖檔</span>
        <div style="display:flex;gap:14px;flex-wrap:wrap;">
          ${w.assets.map(a => `
            <a href="${a.url}" target="_blank" rel="noopener" style="display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:inherit;">
              <span style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;align-items:center;justify-content:center;width:130px;height:64px;">
                <img src="${a.thumb}" alt="${a.name}" style="max-width:100%;max-height:100%;object-fit:contain;">
              </span>
              <span style="font-size:12px;color:var(--ink-soft);">${a.name} ↗</span>
            </a>
          `).join("")}
        </div>
        <p style="font-size:12px;color:var(--ink-soft);margin:8px 0 0;">點圖開啟原始檔網址,簽名檔編輯器裡貼上圖片網址即可插入。</p>
      </div>`;
  }
  if (w.rule) {
    blocks += `<div class="detail-block"><div class="note-box" style="border:1px solid var(--rc);">${w.rule}</div></div>`;
  }
  const key = regionId + ":" + idx;
  blocks += `
    <label class="done-toggle">
      <input type="checkbox" data-done="${key}" ${done[key] ? "checked" : ""}>
      這一站我已經會了
    </label>`;
  return blocks;
}

function openRegion(regionId) {
  const region = DATA.find(r => r.id === regionId);
  const container = document.getElementById("route-container");
  document.getElementById("region-grid").style.display = "none";

  container.innerHTML = `
    <div class="route-view active" style="--rc: var(--${region.color}); --rc-soft: var(--${region.color}-soft);">
      <button class="back-btn">← 回到地圖</button>
      <div class="route-header">
        <div class="region-icon">${ICONS[region.id]}</div>
        <div>
          <h2>${region.title}</h2>
          <p class="region-desc">${region.desc}</p>
        </div>
      </div>
      <div class="trail">
        ${region.waypoints.map((w, i) => `
          <div class="waypoint ${done[regionId + ":" + i] ? "done" : ""}" data-idx="${i}">
            <div class="waypoint-dot">${i + 1}</div>
            <div class="waypoint-card">
              <button class="waypoint-head">
                <span style="flex:1;">
                  <span class="waypoint-title">${w.title}</span>
                  <span class="waypoint-teaser">${w.teaser}</span>
                </span>
                <span class="chevron">›</span>
              </button>
              <div class="waypoint-detail">${waypointDetail(w, regionId, i)}</div>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  container.querySelector(".back-btn").addEventListener("click", () => {
    container.innerHTML = "";
    document.getElementById("region-grid").style.display = "grid";
  });

  container.querySelectorAll(".waypoint-head").forEach(head => {
    head.addEventListener("click", () => {
      head.closest(".waypoint").classList.toggle("open");
    });
  });

  container.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const text = btn.getAttribute("data-copy");
      const finish = () => {
        btn.textContent = "已複製";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = "複製"; btn.classList.remove("copied"); }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(finish).catch(() => fallbackCopy(text, finish));
      } else {
        fallbackCopy(text, finish);
      }
    });
  });

  container.querySelectorAll("[data-done]").forEach(cb => {
    cb.addEventListener("change", () => {
      const key = cb.getAttribute("data-done");
      done[key] = cb.checked;
      saveDone(done);
      cb.closest(".waypoint").classList.toggle("done", cb.checked);
      updateProgress();
      renderGrid();
    });
  });
}

function fallbackCopy(text, cb) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  cb();
}

renderGrid();
updateProgress();
</script>
